plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                mydimension {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

def generatedPlayerMindDimensions = layout.buildDirectory.dir('generated/playerMindDimensions')

tasks.register('generatePlayerMindDimensions') {
    def outputDir = generatedPlayerMindDimensions
    outputs.dir(outputDir)

    doLast {
        def dimensionDir = outputDir.get().dir('data/mydimension/dimension/player_minds').asFile
        delete(dimensionDir)

        def dimensions = [
                ethereal_mind: [
                        type     : 'mydimension:ethereal_mind',
                        generator: [
                                type    : 'minecraft:flat',
                                settings: [
                                        biome              : 'mydimension:ethereal_mind',
                                        features           : false,
                                        lakes              : false,
                                        layers             : [
                                                [block: 'minecraft:stone', height: 60],
                                                [block: 'minecraft:dirt', height: 3],
                                                [block: 'minecraft:quartz_block', height: 3]
                                        ],
                                        structure_overrides: []
                                ]
                        ]
                ],
                mirror_mind  : [
                        type     : 'mydimension:mirror_mind',
                        generator: [
                                type        : 'mydimension:no_structure_noise',
                                biome_source: [
                                        type  : 'minecraft:multi_noise',
                                        preset: 'minecraft:overworld'
                                ],
                                settings    : 'minecraft:overworld'
                        ]
                ],
                water_mind   : [
                        type     : 'mydimension:water_mind',
                        generator: [
                                type    : 'minecraft:flat',
                                settings: [
                                        biome              : 'mydimension:water_mind',
                                        features           : false,
                                        lakes              : false,
                                        layers             : [
                                                [block: 'minecraft:stone', height: 20],
                                                [block: 'minecraft:gravel', height: 5],
                                                [block: 'minecraft:water', height: 50]
                                        ],
                                        structure_overrides: []
                                ]
                        ]
                ],
                nature_mind  : [
                        type     : 'mydimension:nature_mind',
                        generator: [
                                type    : 'minecraft:flat',
                                settings: [
                                        biome              : 'mydimension:nature_mind',
                                        features           : false,
                                        lakes              : false,
                                        layers             : [
                                                [block: 'minecraft:stone', height: 50],
                                                [block: 'minecraft:dirt', height: 9],
                                                [block: 'minecraft:grass_block', height: 1]
                                        ],
                                        structure_overrides: []
                                ]
                        ]
                ]
        ]

        (0..<64).each { slot ->
            dimensions.each { name, json ->
                def file = new File(dimensionDir, "slot_${slot}/${name}.json")
                file.parentFile.mkdirs()
                file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + System.lineSeparator()
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir generatedPlayerMindDimensions
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generatePlayerMindDimensions')
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
